*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

:root{--bg:linear-gradient(168deg,#fbf2e8 0%,#f1ece9 40%,#e3ebf0 75%,#dde8e2 100%);--card:#fffdfa;--ink:#2a2e35;--sub:#5d6470;--chip:#f1ebe4;--line:#f0e9e1;--glass:rgba(255,255,255,.75)}

.seg{display:flex;gap:4px;background:var(--chip);border-radius:12px;padding:3px}.seg button{padding:7px 11px;border-radius:9px;font-size:13.5px;font-weight:650}.seg button.on{background:var(--ink);color:var(--card)}

.item button{padding:8px 12px;border-radius:11px;background:var(--ink);color:var(--card);font-weight:700;font-size:13.5px}.item.verr{opacity:.62}.item .eq{background:#3a8f86;color:#fff}

.qbar{height:6px;border-radius:3px;background:var(--chip);margin-top:6px;overflow:hidden}.qbar i{display:block;height:100%;background:#e9a23b}

.coffreG{position:relative;width:120px;height:100px;margin:10px auto 0}.cof-b{position:absolute;left:10px;right:10px;bottom:0;height:58px;border-radius:8px;background:linear-gradient(#b8862f,#8a5f1c);box-shadow:inset 0 0 0 4px #e9c46a}
.cof-c{position:absolute;left:10px;right:10px;top:12px;height:34px;border-radius:14px 14px 4px 4px;background:linear-gradient(#d39a3a,#a8741f);box-shadow:inset 0 0 0 4px #e9c46a;transform-origin:50% 100%;z-index:2;animation:cofS .3s ease-in-out 3}
.cof-l{position:absolute;left:52px;top:38px;width:16px;height:18px;border-radius:4px;background:#ffe08a;z-index:3}#coffre.ouvert .cof-c{animation:none;transform:translateY(-24px) rotate(-28deg);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}#coffre.ouvert .coffreG::after{content:"";position:absolute;left:50%;top:40%;width:160px;height:160px;transform:translate(-50%,-50%);background:radial-gradient(rgba(255,226,140,.9),rgba(255,226,140,0) 65%);animation:cofG .8s ease-out forwards}

#carte{display:flex;flex-direction:column}#carteTop #solde{position:static;margin-left:auto}
